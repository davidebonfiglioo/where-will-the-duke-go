name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the executable to
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WhereWillTheDukeGo dragon_duke_coordinates.py

      - name: Attach executable to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" "dist/WhereWillTheDukeGo.exe" --repo "$env:GITHUB_REPOSITORY" --clobber
